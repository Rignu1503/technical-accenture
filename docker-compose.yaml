services:

  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-technical-accenture
    environment:
      POSTGRES_DB: technical_accenture
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d technical_accenture" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: app-technical-accenture
    ports:
      - "8080:8080"

    environment:
      DB_URL: r2dbc:postgresql://postgres-db:5432/technical_accenture
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword

    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data: